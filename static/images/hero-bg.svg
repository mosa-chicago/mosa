<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="rg1" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a5c8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d2c52" stop-opacity="0"/>
