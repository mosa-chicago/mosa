      <stop offset="0%" stop-color="#1a5c8a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0d2c52" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg2" cx="75%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#0e6b42" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0d2c52" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
