name: Netlify Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  comment-preview-url:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Post preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const body = `<!-- mosa-preview-comment -->
            ## 🔍 Site Preview

            Netlify is building a live preview of this pull request.

            Once deployed, it will be available at the Netlify deploy preview URL.

            Built from commit \`${sha}\`

            _The preview will be removed when this PR is closed._`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.data.find(c => c.body.includes('mosa-preview-comment'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
